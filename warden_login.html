<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Warden Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5" style="max-width: 520px;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="mb-1">Warden Login</h2>
                <p class="text-muted mb-4">Night attendance and student records</p>
                {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
                <form method="post" action="/warden-login">
                    <label class="form-label" for="email">Warden Email</label>
                    <input class="form-control mb-3" id="email" type="email" name="email" required>
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control mb-3" id="password" type="password" name="password" required>
                    <button class="btn btn-primary w-100" type="submit">Login</button>
                </form>
                <a class="btn btn-link mt-3 px-0" href="/">Back to home</a>
            </div>
        </div>
    </main>
</body>
</html>
