<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Approval Pending</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5 text-center">
                        <div class="profile-avatar large mx-auto mb-4">⏳</div>
                        {% if student and student.photo_url %}
                            <img src="{{ student.photo_url }}" alt="Student profile photo" class="rounded-circle shadow mb-4" style="width:120px;height:120px;object-fit:cover;">
                        {% endif %}
                        <h2 class="mb-3">Your student access is pending approval</h2>
                        <p class="text-muted mb-4"><strong>{{ message }}</strong></p>
                        <div class="alert alert-info">
                            Once the admin approves your account, you will be able to access your full hostel dashboard, ID cards, complaints, laundry token, and notifications.
                        </div>
                        <form action="/withdraw-application" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to withdraw your pending application?');">
                            <button type="submit" class="btn btn-warning">Withdraw Application</button>
                        </form>
                        <a href="/logout" class="btn btn-outline-danger">Logout</a>
                        <a href="/" class="btn btn-primary">Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
