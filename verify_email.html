<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verify Email</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5" style="max-width:520px">
    <h2>Verify your email</h2>
    <p class="text-muted">Enter the 6-digit code sent to <strong>{{ email }}</strong>.</p>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post" action="/verify-email">
        <input type="hidden" name="email" value="{{ email }}">
        <input class="form-control mb-3" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="Verification code" required>
        <button class="btn btn-primary">Verify Email</button>
        <a href="/" class="btn btn-secondary">Back</a>
    </form>
</div>
</body>
</html>
