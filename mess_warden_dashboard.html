<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mess Warden Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<header class="navbar navbar-dark bg-dark"><div class="container-fluid"><span class="navbar-brand">Mess Warden Dashboard</span><a class="btn btn-outline-light btn-sm" href="/logout">Logout</a></div></header>
<main class="container-fluid py-4"><section class="card shadow-sm"><div class="card-body">
    <h2 class="h4">Approved Students</h2><p class="text-muted">Read-only student list for mess operations.</p>
    <div class="table-responsive"><table class="table table-striped table-bordered align-middle">
        <thead class="table-light"><tr><th>Photo</th><th>Name</th><th>Student ID</th></tr></thead>
        <tbody>{% for student in students %}<tr>
            <td>{% if student.photo_url %}<img src="{{ student.photo_url }}" alt="Student photo" style="width:64px;height:64px;object-fit:cover;border-radius:6px;">{% else %}No photo{% endif %}</td>
            <td>{{ student.name or '-' }}</td><td>{{ student.id }}</td>
        </tr>{% else %}<tr><td colspan="3" class="text-center text-muted">No approved students found.</td></tr>{% endfor %}</tbody>
    </table></div>
</div></section></main>
</body></html>
