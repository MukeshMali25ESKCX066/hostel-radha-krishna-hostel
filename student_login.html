<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Student Login</h2>
    {% if request.args.get('verified') %}<div class="alert alert-success">Email verified. You can now sign in.</div>{% endif %}
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/student-login">
        <input type="email" class="form-control mb-3" name="email" placeholder="Student Email" required>
        <input type="password" class="form-control mb-3" name="password" placeholder="Password" required>
        <button class="btn btn-primary">Login</button>
        <a href="/" class="btn btn-secondary">Back</a>
        <a href="/forgot-password" class="btn btn-outline-secondary">Forgot Password?</a>
    </form>
</div>
</body>
</html>
