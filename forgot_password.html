<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5" style="max-width: 480px;">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="mb-3">Reset Password</h3>
            {% if success %}
                <div class="alert alert-success">{{ success }}</div>
            {% endif %}
            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            {% if sent %}
                <div class="alert alert-success">A 6-digit verification code was sent to your {{ delivery_label }}.</div>
                <form action="/reset-password" method="post">
                    <input type="hidden" name="email" value="{{ email }}">
                    <div class="mb-3">
                        <label class="form-label">Enter 6-digit OTP</label>
                        <input class="form-control" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" placeholder="123456" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input class="form-control" type="password" name="password" required>
                    </div>
                    <button class="btn btn-primary w-100">Change Password</button>
                </form>
            {% else %}
                <form action="/forgot-password" method="post">
                    <div class="mb-3">
                        <label class="form-label">Registered Email</label>
                        <input class="form-control" type="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Send 6-digit code to</label>
                        <select class="form-select" name="delivery_method" required>
                            <option value="email">Registered email</option>
                            <option value="sms">Registered mobile number</option>
                        </select>
                    </div>
                    <button class="btn btn-primary w-100">Send OTP</button>
                </form>
            {% endif %}
            <div class="mt-3">
                <a href="/student-login" class="btn btn-outline-secondary btn-sm">Back to Login</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
